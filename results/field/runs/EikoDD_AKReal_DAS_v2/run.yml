title: First real-data inversion (DAS only, KKFLS + TERRA)
date: "2026-11-03"
data: DAS only
cables: [KKFLS, TERRA]
events: 400 events matched to ANSS ComCat locations (2023-06-10 to 2023-12-31, M1.0–4.7), chosen by greedy ray coverage
phases: "P only (-par 2: Vp-only; S picks loaded but not used)"
weighting: none (equal weights)
start: AK112 (3D), interpolated onto the inversion grid
smoothing_km: "≈21"
iterations: 60
rms: 0.481 s → 0.263 s (objective reduced by 70%; final/initial = 0.30)
source: "AlaskaTomography, real_data_inversion (run EikoDD_AKReal_DAS_v2)"
status: done
description: |
  How the 400 events were chosen: the pool is the 1,682 cleaned events with ANSS locations inside the checkerboard event box, at depths of 200 km or less, minus events with bad picks (none were excluded for this run). For each event, straight rays are drawn from the hypocenter to every channel with a good pick (every other channel, as in the inversion; P and S counted separately), and each (5 km cell, ray direction, phase) combination they cross is recorded. Events are then added greedily, each time picking the one that adds the most combinations not yet covered, until there are 400. Events with few picks or that repeat already-covered paths add little, so this favours many picks and crossing rays without separate filters. The 400 selected events cover 55,809 of the 58,188 combinations in the pool.
caveats:
  - "Colour scale is ±20%, set automatically from the 99th percentile of the model, so it is four times wider than the ±5% used for checkerboards."
  - "Resolution is not verified yet: there is no checkerboard test with the same smoothing (sigma 9) yet."
captions:
  a_profile_se-nw.webp: SE–NW profile, % change (dlnV), with Slab2 slab top (green dashed) and catalog earthquakes
  b_profile_se-nw_vp.webp: SE–NW profile, absolute Vp
  c_profile_sw-ne.webp: SW–NE profile, % change (dlnV), with Slab2 slab top (green dashed) and catalog earthquakes
  d_profile_sw-ne_vp.webp: SW–NE profile, absolute Vp
  e_ray_coverage.webp: Straight-ray hit count per 5 km block at six depths (white line = 500 rays)
  f_residuals.webp: Initial vs final travel-time residuals
  g_bfgs_convergence.webp: BFGS convergence (normalized objective vs iteration)
notes: |
  Depth slices show either the % change in velocity from the starting model (dlnV) or the absolute P velocity (Vp, km/s); switch with the buttons above the slice. Each shows the Slab2 slab-top contour at that depth (green dashed), the two profile lines and the event epicentres. The black outline marks the resolved area (blocks with enough rays); outside it the model is drawn in darkened colours.

  Smoothing is sigma_smoo 9 grid cells on the 1 km grid, about 21 km full width at half maximum. 8,424 DAS channels (every other channel).
